services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=propbuild;Username=propbuild;Password=propbuild_dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: propbuild
      POSTGRES_USER: propbuild
      POSTGRES_PASSWORD: propbuild_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propbuild -d propbuild"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
